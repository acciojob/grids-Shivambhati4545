<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap Grid Layout</title>
  <!-- Standard Bootstrap 4 / 5 CSS CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Container -->
  <div class="container custom-container">
    
    <!-- Row 1 -->
    <div class="row custom-row">
      <div class="col-6 col-md-4 custom-col r1-c1">Row1 col1</div>
      <div class="col-6 col-md-8 custom-col r1-c2">Row1 col2</div>
    </div>

    <!-- Row 2 -->
    <div class="row custom-row">
      <div class="col-md-4 offset-md-2 custom-col r2-c1">Row2 col1</div>
      <div class="col-md-4 custom-col r2-c2">Row2 col2</div>
    </div>

    <!-- Row 3 -->
    <div class="row custom-row justify-content-center">
      <div class="col-6 col-md-4 custom-col r3-c1">Row3 col1</div>
      <div class="col-6 col-md-4 custom-col r3-c2">Row3 col2</div>
    </div>

  </div>

</body>
</html>
